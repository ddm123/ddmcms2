server {
    charset off;
    client_max_body_size 128M;

    listen 80;
    proxy_read_timeout 3600s;
    server_name localhost;

    root /home/www/ddmcms;
    index index.html index.php;

    # expires 1y;

    location ~* ^/data/.*\.(?:php|phtml|phar)(?:/|$) {
        return 404;
    }

    location ~ /(?:web\.config|nginx\.conf|\.env|composer\.json|composer\.lock|package\.json|package-lock\.lock|\.htaccess|\.htpasswd|LICENSE)$ {
        return 404;
    }

    location ~ ^/install/(?!index\.php).+$ {
        return 404;
    }

    location ~ ^/data/(?!uploads/).+$ {
        return 404;
    }

    location ~ ^/(design|lib|modules)/.+\.(php|phtml|xml|sql)$ {
        return 404;
    }

    location ~* /\. {
        deny all;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ ^/data/ {
        try_files $uri $uri/ =404;
    }

    location ~ \.(js|css|jpg|gif|png)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }
}
